title: 受注処理マニュアル
document_no: MN-SL-001
version: "1.1"
department: 営業部 業務課
author: 業務課 マニュアル担当
effective_date: 2026-04-01

purpose: |
  得意先からの注文受付から出荷指示までの受注処理を、担当者が誰であっても
  同じ品質・同じリードタイムで実施できるようにする。

scope: |
  - 対象業務: 国内得意先からの通常受注（返品・特注品を除く）
  - 対象者: 営業部 業務課の受注担当者および代行者
  - 対象システム: 販売管理システム、共有フォルダ

terms:
  - term: 受注日
    definition: 得意先からの注文を当社が正式に受け付けた日。注文書の受領日を指す。
  - term: 出荷指示
    definition: 倉庫に対して出荷作業の開始を依頼する販売管理システム上の処理。
  - term: 与信残
    definition: 得意先ごとの与信限度額から未回収債権を差し引いた残額。

revisions:
  - version: "1.0"
    date: 2026-01-10
    author: 業務課 マニュアル担当
    summary: 初版作成
  - version: "1.1"
    date: 2026-04-01
    author: 業務課 マニュアル担当
    summary: 与信確認の手順を追加、出荷締め時刻を15:00に変更

sections:
  - title: 事前準備
    description: 受注処理を始める前に、その日の処理に必要な情報と権限を揃える。
    steps:
      - title: 販売管理システムにログインする
        role: 受注担当者
        system: 販売管理システム
        duration: 1分
        detail: |
          - 社内ポータルの「販売管理システム」リンクを開く
          - 社員番号とパスワードでログインする
          - メニューから「受注入力」を選択する
        note: パスワードの有効期限は90日。期限が近い場合は先に変更しておく。
        checks:
          - 受注入力画面が表示されていること

      - title: 当日の注文書を回収する
        role: 受注担当者
        duration: 10分
        detail: |
          注文書は次の3経路で届く。すべての経路を確認して漏れを防ぐ。
          - 受注専用メールボックス
          - FAX受信トレイ（複合機の共有フォルダ）
          - 営業担当者からの直接持ち込み
        warning: 15:00 以降に届いた注文書は翌営業日扱いとなる。受領時刻を必ず記録すること。
        checks:
          - 3経路すべてを確認したこと
          - 注文書に受領日時を記入したこと

  - title: 受注入力
    description: 注文書の内容を販売管理システムに登録する。
    steps:
      - title: 得意先コードと与信を確認する
        role: 受注担当者
        system: 販売管理システム
        detail: |
          - 「得意先照会」で得意先コードを検索する
          - 与信残が注文金額を上回っていることを確認する
        warning: |
          与信残が不足している場合は入力を進めず、営業部長へ確認を依頼する。
          独断での受注登録は行わない。
        checks:
          - 得意先コードが注文書の宛先と一致していること
          - 与信残 ≧ 注文金額であること

      - title: 明細を入力する
        role: 受注担当者
        system: 販売管理システム
        duration: 1件あたり3分
        detail: |
          - 商品コード、数量、単価、希望納期を注文書どおりに入力する
          - 単価が価格マスタと異なる場合は「特価理由」を必ず記入する
          - 入力後、合計金額が注文書と一致することを確認する
        note: 商品コードが不明な場合は商品マスタの「品名検索」から特定できる。
        checks:
          - 合計金額が注文書と一致していること
          - 希望納期が入力されていること

      - title: 入力内容をダブルチェックする
        role: 受注担当者 → 業務課リーダー
        detail: |
          入力完了後、受注一覧を印刷し、注文書と突き合わせてリーダーの確認を受ける。
          金額 100万円以上の受注は課長確認も必要。
        checks:
          - リーダーの確認印があること
          - 100万円以上の場合は課長確認があること

  - title: 出荷指示と保管
    steps:
      - title: 出荷指示を登録する
        role: 受注担当者
        system: 販売管理システム
        detail: |
          - 「出荷指示」画面で対象受注を選択する
          - 出荷予定日を確認し、登録ボタンを押す
        warning: 当日出荷の締め時刻は 15:00。締め後の登録は翌営業日の出荷になる。
        checks:
          - 出荷指示番号が発行されたこと

      - title: 注文書を保管する
        role: 受注担当者
        detail: |
          - 注文書に受注番号を記入する
          - 月別ファイルに綴じ、共有キャビネットへ保管する
          - 電子データは共有フォルダの「受注/YYYY年度/MM月」へ保存する
        note: 保管期間は7年（国税関係書類）。

faq:
  - q: 注文書の記載内容に不明点がある場合は？
    a: 推測で入力せず、営業担当者経由で得意先に確認する。確認内容は注文書の余白に記録する。
  - q: 入力後に得意先から数量変更の連絡があった場合は？
    a: 出荷指示前であれば受注訂正で対応する。出荷指示後は倉庫へ連絡のうえ、出荷指示取消から再登録する。
  - q: システム障害で入力できない場合は？
    a: 注文書を時系列に並べて受付順を保全し、復旧後にまとめて入力する。復旧見込みは情報システム課へ確認する。

contacts:
