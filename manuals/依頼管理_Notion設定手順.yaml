title: 依頼管理データベース 設定手順（Notion）
document_no: MN-OP-002
version: "1.0"
department: 業務管理
author: 業務管理担当
effective_date: 2026-09-12

purpose: |
  日々受ける依頼を「依頼先 / 納期 / 内容 / 進捗 / 備考」で一元管理し、
  スマホとPCのどちらからでも同じ状態を確認・更新できるようにする。
  Slack は無料プランのため履歴が90日で見えなくなる。依頼の記録は Notion 側に残す。

scope: |
  - 対象: 個人またはチームで受ける日常業務の依頼管理
  - 使用ツール: Notion（無料プランで可）、Slack（無料プラン）
  - 所要時間: 初回設定 約20分

terms:
  - term: データベース
    definition: Notion 上の表形式のページ。1行が1件の依頼にあたる。
  - term: プロパティ
    definition: データベースの列のこと。それぞれに種類（テキスト・日付・セレクト等）を設定する。
  - term: ビュー
    definition: 同じデータを目的別に表示し分ける仕組み。表・ボード・カレンダーなどがある。

revisions:
  - version: "1.0"
    date: 2026-09-12
    author: 業務管理担当
    summary: 初版作成

sections:
  - title: テンプレートの取り込み
    description: 用意した CSV を Notion に読み込ませ、データベースの土台を作る。
    steps:
      - title: Notion にログインする
        role: 本人
        system: Notion
        duration: 3分
        detail: |
          - PC のブラウザで Notion を開き、アカウントを作成またはログインする
          - 無料プランのままで問題ない
        note: 設定作業は PC で行う。スマホアプリは設定後の確認・更新に使う。

      - title: CSV を取り込む
        role: 本人
        system: Notion
        duration: 2分
        detail: |
          - 左サイドバーの下部にある「インポート」を選ぶ
          - 読み込み形式の一覧から「CSV」を選ぶ
          - 「依頼管理_テンプレート.csv」を指定する
        warning: |
          この CSV は Excel で開くと文字化けする場合があるが、Notion への取り込みには影響しない。
          内容の編集は Notion に取り込んだあとに行うこと。
        checks:
          - 6件のサンプル行を持つ表が作成されていること
          - 列が「内容・依頼先・受領日・納期・進捗・備考・Slackリンク」の7つあること

      - title: ページ名を分かりやすくする
        role: 本人
        system: Notion
        detail: |
          取り込んだページのタイトルを「依頼管理」など運用に合った名前に変更する。
          左サイドバーの「お気に入り」に追加しておくと、スマホからも開きやすい。

  - title: プロパティ（列）の設定
    description: |
      取り込んだ直後はすべての列が文字列として扱われる。種類を設定し直すことで、
      並べ替え・絞り込み・カレンダー表示ができるようになる。ここが最も重要な工程。
    steps:
      - title: 日付の列を「日付」に変更する
        role: 本人
        system: Notion
        duration: 3分
        detail: |
          「受領日」「納期」のそれぞれについて、次の操作を行う。
          - 列名をクリックし、「プロパティを編集」を開く
          - 種類を「日付」に変更する
        note: |
          種類を変更すると、取り込んだ 2026/09/16 のような文字列が日付として認識される。
          認識されない行があれば、その行だけ手動で日付を選び直す。
        checks:
          - 納期の列でカレンダーが表示されること
          - サンプル6件すべてに日付が入っていること

      - title: 進捗の列を「セレクト」に変更する
        role: 本人
        system: Notion
        duration: 3分
        detail: |
          - 「進捗」の列名をクリックし、種類を「セレクト」に変更する
          - 選択肢が「未着手・対応中・確認待ち・完了」の4つになっていることを確認する
          - 色を割り当てる（例 未着手=グレー、対応中=青、確認待ち=黄、完了=緑）
        warning: |
          進捗は必ずセレクトにして、自由入力にしない。
          「対応中」「対応中です」「着手済」のように表記がぶれると、
          絞り込みも集計も機能しなくなる。
        checks:
          - 選択肢が4つに固定されていること
          - 新しい行で進捗が選択式になること

      - title: 依頼先の列を「セレクト」に変更する
        role: 本人
        system: Notion
        detail: |
          - 「依頼先」の列名をクリックし、種類を「セレクト」に変更する
          - 実際の取引先名・部署名を選択肢として追加していく
        note: |
          「(株)A社」「A社」「A社様」のような表記ゆれを防ぐのが目的。
          選択肢は運用しながら増やしていけばよい。

      - title: Slackリンクの列を「URL」に変更する
        role: 本人
        system: Notion
        detail: |
          - 「Slackリンク」の列名をクリックし、種類を「URL」に変更する
          - サンプル行に入っている example.slack.com のURLは削除しておく
        note: |
          Slack のメッセージを右クリック（スマホは長押し）して「リンクをコピー」で
          取得したURLをここに貼る。Slack無料プランでは90日で辿れなくなるため、
          重要な依頼は「備考」にも要点を書き写しておく。

  - title: ビュー（表示）の作成
    description: 同じデータを、目的別に3つの見え方で使い分ける。
    steps:
      - title: 納期順のテーブルを作る
        role: 本人
        system: Notion
        duration: 3分
        detail: |
          最初から表示されているテーブルを、朝イチの確認用に整える。
          - 並べ替えに「納期」の昇順を設定する
          - 絞り込みに「進捗」が「完了」ではない、を設定する
        note: 完了した依頼を隠すことで、対応すべきものだけが上から順に並ぶ。
        checks:
          - 納期が近い順に並んでいること
          - 完了した「請求書の再発行（C社）」が表示されていないこと

      - title: 進捗ボードを作る
        role: 本人
        system: Notion
        duration: 2分
        detail: |
          - ビューを追加し、種類に「ボード」を選ぶ
          - グループ化の基準を「進捗」にする
          - ビュー名を「進捗」にする
        note: |
          スマホで使うのは主にこのボード。カードを長押しして別の列に動かすだけで
          進捗を更新できる。移動中や外出先での更新はこれが最も速い。

      - title: 納期カレンダーを作る
        role: 本人
        system: Notion
        duration: 2分
        detail: |
          - ビューを追加し、種類に「カレンダー」を選ぶ
          - 基準にする日付を「納期」にする
          - ビュー名を「納期」にする
        note: 特定の週に納期が固まっていないかを確認し、事前に調整するために使う。

      - title: スマホアプリを入れる
        role: 本人
        duration: 3分
        detail: |
          - スマホに Notion アプリをインストールしてログインする
          - 作成した「依頼管理」ページをお気に入りに追加する
        checks:
          - スマホで進捗ボードが開けること
          - カードを動かして進捗を変更できること

  - title: 日々の運用
    description: |
      設定よりも運用の型が重要。依頼が流れてくる場所（Slack）と、
      依頼を管理する場所（Notion）を分け、必ず後者に着地させる。
    steps:
      - title: Slack に依頼受付チャンネルを作る
        role: 本人
        system: Slack
        detail: |
          - 「#依頼受付」のようなチャンネルを1つ作る
          - 関係者に、依頼はDMではなくこのチャンネルに書いてもらうよう依頼する
        warning: |
          DM で依頼を受けると、自分が不在のときに誰も状況を把握できない。
          属人化を避けるため、依頼はチャンネルに集約する。
        note: |
          チャンネルの説明欄に「依頼時は 内容・希望納期 を明記してください」と
          書いておくと、記入漏れによる確認の往復が減る。

      - title: 受けた依頼をその場で1行足す
        role: 本人
        system: Notion
        duration: 1件あたり1分
        detail: |
          依頼を受けたら、後回しにせずその場で Notion に1行追加する。
          - 内容（短く要旨だけ）
          - 依頼先、受領日、納期、進捗（未着手）
          - Slackリンク（メッセージのリンクを貼る）
        warning: |
          「あとでまとめて入力する」は必ず漏れる。Slack無料プランでは
          90日で元のメッセージが辿れなくなるため、記録が復元できなくなる。
        checks:
          - 依頼を受けた当日中に Notion に登録されていること

      - title: 納期のリマインダーを設定する
        role: 本人
        system: Notion
        detail: |
          納期の日付をクリックし、「リマインド」から通知タイミング（前日など）を設定する。
          スマホアプリの通知を有効にしておくと、外出先でも気づける。

      - title: 週に一度、棚卸しする
        role: 本人
        duration: 10分
        detail: |
          - 「確認待ち」のまま止まっている依頼がないかを見る
          - 納期を過ぎているものがないかを見る
          - 完了したものの進捗を「完了」に更新する
        note: 止まっている依頼はたいてい相手待ち。こちらから催促する判断材料になる。

  - title: 月次の振り返り
    description: 蓄積したデータを分析にかけ、業務量の実態を把握する。
    steps:
      - title: Notion から CSV を書き出す
        role: 本人
        system: Notion
        detail: |
          - データベース右上の「…」から「エクスポート」を選ぶ
          - 形式に「CSV」を指定して書き出す
        note: エクスポートは PC のブラウザ版から行う。

      - title: 分析ツールにかける
        role: 本人
        detail: |
          書き出した CSV を、社内ツール excel_analyze.py で分析する。
          依頼先ごとの件数、月ごとの推移、進捗の滞留状況が自動で出力される。
        checks:
          - 依頼先別の件数が出力されていること
          - 月次推移が出力されていること

faq:
  - q: 依頼先が毎回変わる場合もセレクトにすべきか？
    a: |
      セレクトのままでよい。Notion のセレクトは入力時にその場で選択肢を追加できるため、
      新しい依頼先が出るたびに追加していけば、自然と一覧が育つ。
  - q: 項目を増やしたくなった場合は？
    a: |
      列を追加すればよい。よく足されるのは「担当者」（複数人で運用する場合）、
      「優先度」「着手予定日」など。ただし最初から増やしすぎると入力が続かないため、
      運用してみて本当に必要だと感じたものだけ足す。
  - q: Slack のメッセージが90日で見えなくなると何が困るか？
    a: |
      依頼の経緯（誰がいつ何と言ったか）が辿れなくなる。トラブル時の確認や
      次回の見積もりの根拠が失われるため、重要な依頼は要点を Notion の備考に
      書き写しておく。添付ファイルも Notion 側にコピーしておくとよい。
  - q: チームで共有したい場合は？
    a: |
      Notion のページ右上「共有」からメンバーを招待する。無料プランでもゲスト招待には
      人数の上限があるため、人数が増える場合はプランを確認すること。

contacts:
  - name: 業務管理担当
    role: 本手順書の内容・運用ルール
    contact: 社内チャットにて
